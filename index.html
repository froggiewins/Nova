<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova</title>
<meta name="description" content="Nova: a small AI chatbot trained from scratch, running entirely in your browser.">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1b2233;--muted:#5d6680;--line:#d6dce8;--accent:#2f8f6a;--accent-ink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#11141c;--card:#1a1f2b;--ink:#e6e9f2;--muted:#9aa3bb;--line:#2b3243;--accent:#5fd3a5;--accent-ink:#0d1f17}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
.app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding:0 16px}
header{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:1.15rem}small{color:var(--muted)}button{font:inherit;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:18px 0;display:flex;flex-direction:column;gap:12px;min-height:0}
.m{max-width:85%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.b{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.thinking{color:var(--muted);font-style:italic}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0;overflow-x:auto;white-space:pre;font:13px/1.45 Consolas,ui-monospace,monospace}
.copy{display:block;margin-top:4px;font-size:12px;background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);padding:2px 8px}
form{display:flex;gap:8px;padding:12px 0 16px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 18px;font-weight:600}
.send:disabled,input:disabled{opacity:.5;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--ink)}
.loading{display:flex;flex-direction:column;gap:8px;margin:auto 0;align-items:center;color:var(--muted)}
.bar{width:min(320px,80%);height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar div{height:100%;width:0;background:var(--accent);transition:width .2s}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Nova</h1><small>A tiny AI trained from scratch. Runs entirely in your browser.</small></div>
    <button class="ghost" id="clear" type="button">New chat</button>
  </header>
  <div id="log">
    <div class="loading" id="loading"><div>Loading Nova's brain (20 MB)…</div><div class="bar"><div id="bar"></div></div></div>
  </div>
  <form id="f">
    <input id="i" autocomplete="off" placeholder="Loading…" disabled aria-label="Message">
    <button class="send" id="send" disabled>Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log'), input = document.getElementById('i'), send = document.getElementById('send');
const VERSION = 2; // bump this when you update nova-worker.js or the model, so browsers fetch the new files
const worker = new Worker('nova-worker.js?v=' + VERSION);
const INTRO = "Hi! I'm Nova, a small model trained from scratch. Ask me about everyday things, animals, countries, science, or how to build web pages in HTML.";
let busy = false, current = null;

function fill(d, t) {
  d.textContent = '';
  t.split('```').forEach((part, k) => {
    if (k % 2) {
      const pre = document.createElement('pre');
      pre.textContent = part.replace(/^[a-z]*\n/, '').replace(/\n$/, '');
      const b = document.createElement('button');
      b.className = 'copy'; b.type = 'button'; b.textContent = 'Copy code';
      b.onclick = () => navigator.clipboard.writeText(pre.textContent).then(() => b.textContent = 'Copied', () => {});
      d.append(pre, b);
    } else if (part.trim()) {
      d.append(document.createTextNode(part.replace(/^\n|\n$/g, '')));
    }
  });
}
function add(t, c) {
  const d = document.createElement('div');
  d.className = 'm ' + c; fill(d, t);
  log.append(d); log.scrollTop = log.scrollHeight;
  return d;
}
function setBusy(b) { busy = b; send.disabled = b; }

worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === 'progress') document.getElementById('bar').style.width = (m.value * 100).toFixed(0) + '%';
  else if (m.type === 'ready') {
    document.getElementById('loading').remove();
    add(INTRO, 'b');
    input.disabled = false; send.disabled = false; input.placeholder = 'Message Nova…'; input.focus();
  } else if (m.type === 'token' && current) { fill(current, m.text); current.classList.remove('thinking'); log.scrollTop = log.scrollHeight; }
  else if (m.type === 'done' && current) { fill(current, m.text); current.classList.remove('thinking'); current = null; setBusy(false); log.scrollTop = log.scrollHeight; input.focus(); }
  else if (m.type === 'error') {
    if (current) { current.textContent = 'Something went wrong: ' + m.message; current = null; setBusy(false); }
    else document.getElementById('loading').textContent = 'Could not load Nova: ' + m.message;
  }
};
worker.postMessage({ type: 'load' });

document.getElementById('f').onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = '';
  add(text, 'u');
  current = add('Thinking…', 'b'); current.classList.add('thinking');
  setBusy(true);
  worker.postMessage({ type: 'chat', text });
};
document.getElementById('clear').onclick = () => {
  if (busy) return;
  worker.postMessage({ type: 'reset' });
  log.innerHTML = ''; add("New chat started. What's up?", 'b');
};
</script>
</body>
</html>
